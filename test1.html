<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>文档标题</title>
</head>
<body>
  <div id="app">{{ message }}</div>
  
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script>
    const { createApp, ref } = Vue

    createApp({
    setup() {
        const message = ref('Hello vue!')
        return {
        message
        }
    }
    }).mount('#app')
</script>
</body>
</html>
